# Community Scout: builds the `fork` branch in public, records signed
# provenance for every built file, and deploys exactly those files to
# Netlify. Anyone can check a file the site serves with:
#   gh attestation verify <file> --repo <this repository>
name: Community Scout

on:
  push:
    branches: [fork]
    # Each production deploy costs Netlify credits; notes alone don't need one.
    paths-ignore: [FORK.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-scout-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only the public repository deploys; copies elsewhere stay inert.
    if: github.repository == 'lovon-spec/scout'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: websites/app
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.3
          package-manager-cache: false

      - name: Install
        run: |
          corepack enable
          yarn install --immutable

      - name: Test
        run: |
          yarn exec wagmi generate
          yarn test

      - name: Build
        run: yarn build
        env:
          REACT_APP_SUBGRAPH_GNOSIS_ENDPOINT: ${{ vars.REACT_APP_SUBGRAPH_GNOSIS_ENDPOINT }}
          REACT_APP_SUBGRAPH_KLEROS_DISPLAY_GNOSIS_ENDPOINT: ${{ vars.REACT_APP_SUBGRAPH_KLEROS_DISPLAY_GNOSIS_ENDPOINT }}
          REACT_APP_IPFS_CHECK_GATEWAY: ${{ vars.REACT_APP_IPFS_CHECK_GATEWAY }}
          WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
          REACT_APP_COMMIT_SHA: ${{ github.sha }}
          REACT_APP_SOURCE_REPO: ${{ github.repository }}
          REACT_APP_BUILD_RUN_ID: ${{ github.run_id }}

      - name: Record provenance of the built files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: websites/app/dist/**

      - name: Deploy to Netlify
        # --no-build: the CLI would otherwise build again, without the
        # variables above, and deploy that build instead of the attested one.
        run: npx --yes netlify-cli@27.10.0 deploy --prod --no-build --dir dist --functions netlify/functions --message "$GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  keep-source:
    # `fork` is rebased when the upstream branches change, which would leave
    # deployed commits unreachable; a tag per deploy keeps each one.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the deployed commit
        run: |
          tag="deployed/$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null ||
            # A re-run of the same run finds its tag already there.
            [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA" ]
        env:
          GH_TOKEN: ${{ github.token }}
